name: Build, Test and Publish Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'models/**'
      - 'outputs/**'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data, train model and create outputs
        run: python src/pipeline.py

      - name: Run automated tests
        run: pytest -q

      - name: Commit reproducible data and model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ models/ outputs/
          if ! git diff --cached --quiet; then
            git commit -m "Generate reproducible data, trained model and outputs [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated artifacts are already up to date."
          fi
