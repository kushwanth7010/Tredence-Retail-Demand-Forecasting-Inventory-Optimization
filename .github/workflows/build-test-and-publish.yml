name: Build, Test and Publish Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data, train model and create outputs
        run: python src/pipeline.py

      - name: Run automated tests
        run: pytest -q

      - name: Upload reproducible data, model and reports
        uses: actions/upload-artifact@v4
        with:
          name: generated-retail-data-model-and-reports
          path: |
            data/
            models/
            outputs/
          if-no-files-found: error
